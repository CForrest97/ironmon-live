name: Deploy application

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-application
  cancel-in-progress: false

jobs:
  deploy:
    name: Wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for viewport coverage
        run: npm exec --workspace=@ironmon-live/web -- playwright install --with-deps chromium

      - name: Run checks
        run: npm run check

      - name: Deploy Worker and assets
        run: npm run deploy --workspace=@ironmon-live/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
