name: Release companion

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: companion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check

  build:
    name: Build ${{ matrix.architecture }}
    needs: check
    environment: prod
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: aarch64
            binary_architecture: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - architecture: x86_64
            binary_architecture: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build companion and signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node scripts/configure-tauri-updater.ts apps/companion/src-tauri/tauri.conf.json "${GITHUB_REF_NAME#v}" apps/web/src/companion-release.json
          npm run tauri:build --workspace=@ironmon-live/companion -- --target "${{ matrix.target }}"
      - name: Verify release artifacts
        run: |
          APP_PATH=$(find apps/companion/src-tauri/target/${{ matrix.target }}/release/bundle -name '*.app' -type d | head -1)
          DMG_PATH=$(find apps/companion/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' -type f | head -1)
          test -n "$APP_PATH" && test -n "$DMG_PATH"
          file "$APP_PATH/Contents/MacOS/"* | grep -q '${{ matrix.binary_architecture }}'
          shasum -a 256 "$DMG_PATH" > "$DMG_PATH.sha256"
      - name: Stage architecture artifacts
        run: |
          mkdir -p release/${{ matrix.architecture }}
          find apps/companion/src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' -o -name '*.sha256' \) -exec cp {} release/${{ matrix.architecture }}/ \;
          for file in release/${{ matrix.architecture }}/*; do
            case "$file" in
              *.dmg.sha256) suffix=dmg.sha256 ;;
              *.tar.gz.sig) suffix=tar.gz.sig ;;
              *.tar.gz) suffix=tar.gz ;;
              *.dmg) suffix=dmg ;;
              *) echo "Unexpected release artifact: $file"; exit 1 ;;
            esac
            mv "$file" "${file%/*}/IronMON-Live_${GITHUB_REF_NAME#v}_${{ matrix.architecture }}.$suffix"
          done
      - name: Upload architecture artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-${{ matrix.architecture }}
          path: release/${{ matrix.architecture }}
          if-no-files-found: error

  publish:
    name: Publish to R2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: companion-*
          path: release
      - name: Create updater manifest
        run: |
          mkdir release-flat
          find release -type f -exec cp {} release-flat/ \;
          node scripts/create-update-manifest.ts release-flat "${GITHUB_REF_NAME#v}" "https://downloads.live.craigforrest.co.uk/companion/v${GITHUB_REF_NAME#v}"
      - name: Refuse an existing version
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if aws s3 ls "s3://${{ vars.R2_RELEASE_BUCKET }}/companion/v${GITHUB_REF_NAME#v}/" --endpoint-url "https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" | grep -q .; then
            echo "Release version already exists" >&2
            exit 1
          fi
      - name: Upload immutable release and manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          VERSION="${GITHUB_REF_NAME#v}"
          aws s3 cp release-flat/ "s3://${{ vars.R2_RELEASE_BUCKET }}/companion/v$VERSION/" --recursive --exclude latest.json --endpoint-url "$ENDPOINT"
          aws s3 cp release-flat/latest.json "s3://${{ vars.R2_RELEASE_BUCKET }}/companion/latest.json" --content-type application/json --cache-control no-cache --endpoint-url "$ENDPOINT"
