name: Repository improvement
description: Record recurring agent, process, or validation friction.
title: "[Repository]: "
labels:
  - repository
body:
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What went wrong, and what was the impact?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Evidence and frequency
      description: Link examples and state how often the problem has occurred.
    validations:
      required: true
  - type: dropdown
    id: response
    attributes:
      label: Likely response
      options:
        - Clarify agent guidance
        - Add or strengthen validation
        - Change the contribution workflow
        - Investigate before choosing
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Success condition
      description: How will we know the repository has improved?
    validations:
      required: true
