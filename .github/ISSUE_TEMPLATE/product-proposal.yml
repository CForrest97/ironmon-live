name: Product proposal
description: Capture an opportunity or product question for discovery.
title: "[Product]: "
labels:
  - product
body:
  - type: markdown
    attributes:
      value: >-
        Issues are an intake queue, not product source of truth. Accepted
        knowledge must be promoted into versioned product or domain documents.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Describe the observed problem without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link or summarize observations and distinguish assumptions.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What meaningful change would indicate progress?
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: What still needs discovery or a decision?
    validations:
      required: true
